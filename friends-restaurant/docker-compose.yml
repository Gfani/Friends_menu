version: '3.8'

services:
  friends-menu:
    build:
      context: .
      dockerfile: Dockerfile
    image: friends-menu:latest
    container_name: friends-menu-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - JWT_SECRET=friends-central-perk-super-secret-jwt-key-2026
      - DATABASE_URL=file:./prisma/dev.db
      - UPLOAD_DIR=./uploads
    volumes:
      - menu-db:/app/prisma
      - menu-uploads:/app/uploads

volumes:
  menu-db:
  menu-uploads:
